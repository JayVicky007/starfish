name: Project Starfish Continuous Integration

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify-build:
    name: Type-Check and Production Compile Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Source Code
        uses: actions/checkout@v4

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Project Dependencies
        run: npm ci

      - name: Execute Strict TypeScript Type Validation
        run: npx tsc --noEmit

      - name: Verify Production Compilation Bundle Output
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-public-key
        run: npm run build

  database-tests:
    name: Supabase Database Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Source Code
        uses: actions/checkout@v4

      - name: Initialize Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Local Supabase Stack
        run: supabase start --exclude studio

      - name: Reset Local Database and Apply Migrations
        run: supabase db reset

      - name: Run Database Tests
        run: supabase test db
